      title: "Suggested for Plasma"
      subtitle:
        string: "Apps designed specifically for Plasma"
      appids:
        list:
          - org.kde.okular
          - org.kde.kate
          - org.kde.gwenview
          - org.kde.kdenlive
          - org.kde.neochat
          - org.kde.keysmith
          - org.kde.marknote
