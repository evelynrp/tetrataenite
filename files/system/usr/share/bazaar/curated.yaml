rows:
  - section:
      title: "Suggested for Everyone"
      subtitle:
        string: "Apps that offer basic functionality for any desktop"
      appids:
        list:
          - com.calibre_ebook.calibre
          - io.github.diegopvlk.Cine
          - org.gajim.Gajim
          - org.gimp.GIMP
          - org.keepassxc.KeePassXC
          - org.libreoffice.LibreOffice
          - org.localsend.localsend_app
