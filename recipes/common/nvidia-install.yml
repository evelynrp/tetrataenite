modules:
  - type: files
    files:
      - source: nvidia
        destination: /

  - type: script
    scripts:
      - installnvidiakmod.sh
    secrets:
      - type: env
        name: KERNEL_SIGNING_SECRET
        mount:
          type: file
          destination: /tmp/certs/private_key.priv

  - type: script
    scripts:
      - installnvidiapackages.sh
      - remove-nvidia-repos.sh
      - setearlyloading.sh
      - setdrmvariables.sh
