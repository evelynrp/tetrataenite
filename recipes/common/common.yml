# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: os-release
    properties:
      ID: fedora
      NAME: tetrataenite
      PRETTY_NAME: tetrataenite

  - type: dnf
    remove:
      packages:
        - fedora-chromium-config
        - fedora-chromium-config-gnome
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
        - firefox
        - firefox-langpacks

  - type: dnf
    repos:
      copr:
        - secureblue/packages
      files:
        - google-chrome.repo
    install:
      install-weak-deps: false
      packages:
        - adobe-source-code-pro-fonts
        - adobe-source-sans-pro-fonts
        - adobe-source-serif-pro-fonts
        - atkinson-hyperlegible-next-fonts
        - bazaar
        - distrobox
        - fontawesome-fonts-all
        - google-chrome-stable
        - google-noto-emoji-fonts
        - google-noto-sans-cjk-fonts
        - opendyslexic-fonts
        - steam-devices
        - tetrataenite-logos-0.0.2-1.fc43.x86_64.rpm
        - neovim

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - AtkinsonHyperlegibleMono
        - NerdFontsSymbolsOnly
        - OpenDyslexic

  - type: brew
    nofile-limits: true
    brew-analytics: false
    auto-update: true
    auto-upgrade: true

  - type: justfiles
    validate: true
    install: true
    include:
      - common.just

  - type: systemd
    system:
      enabled:
        - bootc-status.service
    user:
      enabled:
        - tetrataenite-flatpak-setup.service
        - tetrataenite-update-verification.service

  - type: script
    scripts:
      - set-build-date.sh
      - chrome-wrapper.sh

  - type: initramfs

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
