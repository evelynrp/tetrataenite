# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: os-release
    properties:
      ID: fedora
      ID_LIKE: fedora
      NAME: tetrataenite
      PRETTY_NAME: tetrataenite

  - type: dnf
    remove:
      packages:
        - fedora-chromium-config
        - fedora-chromium-config-gnome
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
        - firefox
        - firefox-langpacks

  - type: dnf
    repos:
      copr:
        - secureblue/packages
      files:
        - google-chrome.repo
        - https://repository.mullvad.net/rpm/stable/mullvad.repo
        - https://repo.secureblue.dev/secureblue.repo
    install:
      install-weak-deps: false
      packages:
        - adobe-source-code-pro-fonts
        - adobe-source-sans-pro-fonts
        - adobe-source-serif-pro-fonts
        - atkinson-hyperlegible-next-fonts
        - bazaar
        - distrobox
        - google-chrome-stable
        - google-noto-emoji-fonts
        - google-noto-sans-cjk-fonts
        - mullvad-vpn
        - opendyslexic-fonts
        - steam-devices
        - tetrataenite-logos-0.0.2-1.fc43.x86_64.rpm
        - trivalent
        - neovim
        - vim

  - type: files
    files:
      - source: system
        destination: /

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          title: Flathub (system)
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          type: system
        install:
          - com.github.tchx84.Flatseal

  - type: fonts
    fonts:
      nerd-fonts:
        - AtkinsonHyperlegibleMono
        - NerdFontsSymbolsOnly
        - OpenDyslexic

  - type: brew
    nofile-limits: true
    brew-analytics: false
    auto-update: true
    auto-upgrade: true

  - type: systemd
    system:
      enabled:
        - flatpak-system-update.timer
        - bootc-fetch-apply-updates.timer

  - type: justfiles
    validate: true
    install: true
    include:
      - 30-secureboot.just
      - common.just

  - type: script
    scripts:
      - set-build-date.sh

  - type: initramfs

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
